name: CI

# Offline unit tests only. No secrets, no deployments, no network services, no access to any
# other repository. Pull requests from forks run with a read-only token and no secrets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.13"
      - name: Install dependencies (pinned)
        run: python -m pip install --quiet -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
